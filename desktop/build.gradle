plugins {
    id 'application'
}

application {
    mainClass = 'br.pesca.desktop.DesktopLauncher'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// macOS exige esta flag para o LWJGL3
tasks.named('run') {
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs '-XstartOnFirstThread'
    }
    workingDir = rootProject.projectDir   // sessoes_pesca.csv fica na raiz do projeto
}

// Gera um .jar executavel unico:  gradle :desktop:dist  ->  desktop/build/libs/pesca-no-ritmo.jar
tasks.register('dist', Jar) {
    archiveFileName = 'pesca-no-ritmo.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'br.pesca.desktop.DesktopLauncher'
    }
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

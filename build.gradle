allprojects {
    version = '1.0'
    ext {
        gdxVersion = '1.12.1'
        jSerialCommVersion = '2.10.4'
    }
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 11
    }
}
